{% load menu_tags static %}

<header class="fixed top-0 z-40 w-full md:top-6">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div class="relative flex h-16 items-center gap-3 border-b border-gray-200 bg-white/95 px-3 shadow-lg shadow-black/[0.04] backdrop-blur-md md:rounded-2xl md:border">
      <!-- Brand ------------------------------------------------------ -->
      <a class="brand" href="/" aria-label="Traveling Books — home">
        <span class="brand-mark">TB</span>
        <span class="brand-name">Traveling<span class="text-blue-700">Books</span></span>
      </a>
      <nav class="hidden lg:flex lg:flex-1 lg:items-center" aria-label="Main">
           {% render_menu "main" %}
      </nav>
      <!-- ============ Right cluster ============ -->
      <div class="ml-auto flex items-center gap-2">

        <!-- Search (templates/search) -->
        <form action="/search/" method="get" class="hidden xl:block">
          <label for="q" class="sr-only">Search books</label>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 fill-gray-400" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.06 8.95l3 2.99 1.4-1.41-2.98-3A5 5 0 0 0 7 2Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
            <input id="q" name="q" type="search" placeholder="Title, author, BCID…"
                   class="h-9 w-56 rounded-lg border border-gray-200 bg-gray-50 pl-9 pr-3 text-sm text-gray-900 placeholder-gray-400 shadow-xs transition-colors focus:border-blue-300 focus:bg-white focus:ring-0">
          </div>
        </form>

        <!-- Search icon-only below xl -->
        <a href="/search/" aria-label="Search" class="grid h-9 w-9 place-items-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-900 xl:hidden">
          <svg class="h-4 w-4 fill-current" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2a5 5 0 1 0 3.06 8.95l3 2.99 1.4-1.41-2.98-3A5 5 0 0 0 7 2Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
        </a>

        {% if not user.is_authenticated %} 
        <div class="items-center gap-2 sm:flex">
          <a href="/signin" class="btn-sm bg-white py-2 text-gray-800 ring-1 ring-gray-200">Login</a>
          <a href="/signup" class="btn-sm bg-gray-800 py-2 text-gray-200">Register</a>
        </div>
        {% else %}
        <div class="items-center gap-2 sm:flex">
          <a href="/dashboard" class="btn-sm bg-white text-gray-800 ring-1 ring-gray-200 hover:bg-gray-50">Dashboard</a>
          <a href="/logout" class="btn-sm bg-gray-800 text-gray-200 hover:bg-gray-900">Logout</a>
        </div>
        {% endif %}
        <!-- Mobile toggle -->
        <button id="menu-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false"
                class="grid h-9 w-9 place-items-center rounded-lg text-gray-700 hover:bg-gray-100 lg:hidden">
          <span class="sr-only">Open main menu</span>
          <svg class="h-5 w-5 fill-current" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14v2H3V5Zm0 4h14v2H3V9Zm0 4h14v2H3v-2Z"/></svg>
        </button>
      </div>
    </div>

    <!-- ============ Mobile panel ============ -->
    <div id="mobile-menu" hidden class="mt-2 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-xl shadow-black/[0.07] lg:hidden">
      <!-- Same partial as the desktop nav, stacked: the shared <ul> is a
           horizontal flex row, so override its direction here. -->
      <nav aria-label="Mobile" class="p-2 [&_ul]:flex-col [&_ul]:items-stretch">
        {% render_menu "main" %}
      </nav>
    </div>
  </div>
</header>
