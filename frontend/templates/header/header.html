  {% load menu_tags static %}
  <header class="fixed top-2 z-30 w-full md:top-6">
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
      <div class="relative flex h-14 items-center justify-between gap-3 rounded-2xl border border-gray-200 bg-white/90 px-3 shadow-lg shadow-black/[0.03] backdrop-blur-xs">
        <div class="flex flex-1 items-center">
          <a class="inline-flex" aria-label="Cruip" href="/">
            <img src="{% static 'vendors/images/book_icon.png' %}" alt="Logo" width="26" height="26" />
          </a>&nbsp;&nbsp;&nbsp;
          {% render_menu "main" %}
        </div>
       
        <ul class="flex flex-1 items-center justify-end gap-3">
          {% if user.is_authenticated %}
          <li>
            <a class="btn-sm bg-white text-gray-800 shadow-sm hover:bg-gray-50" href="/dashboard">
              Dashboard
            </a>
          </li>
          <li>
            <a class="btn-sm bg-gray-800 text-gray-200 shadow-sm hover:bg-gray-900" href="/logout">
              Sign out
            </a>
          </li>
          {% else %}
          <li>
            <a class="btn-sm bg-white text-gray-800 shadow-sm hover:bg-gray-50" href="/signin">
              Login
            </a>
          </li>
          <li>
            <a class="btn-sm bg-gray-800 text-gray-200 shadow-sm hover:bg-gray-900" href="/signup">
              Register
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </header>
