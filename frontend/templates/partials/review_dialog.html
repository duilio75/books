{% comment %}
Review dialog. Include it on any page that has [data-book] buttons; the
ReviewDialog component wires itself up to #review-dialog automatically.
{% endcomment %}
<dialog id="review-dialog" class="fixed top-1/2 left-1/2 m-0 w-full max-w-md -translate-x-1/2 -translate-y-1/2 rounded-2xl p-0 shadow-2xl backdrop:bg-black/50">
  <div class="flex items-start justify-between border-b border-gray-100 px-6 py-4">
    <div class="flex gap-4">
      <img id="rdlg-cover" src="" alt="" class="h-16 w-12 rounded object-cover shadow" />
      <div>
        <p id="rdlg-title" class="font-semibold text-gray-900 leading-tight"></p>
        <p id="rdlg-author" class="mt-0.5 text-sm text-gray-500"></p>
      </div>
    </div>
    <button data-dialog-close class="ml-4 shrink-0 text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
  </div>

  <form id="rdlg-form" class="px-6 py-5 space-y-4">
    <input type="hidden" id="rdlg-volume-id" />
    <input type="hidden" id="rdlg-isbn" />
    <input type="hidden" id="rdlg-book-title" />
    <input type="hidden" id="rdlg-book-author" />
    <input type="hidden" id="rdlg-book-cover" />
    <input type="hidden" id="rdlg-rating" />
    <input type="hidden" id="rdlg-book-description" />

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Your rating</label>
      <div id="star-row" class="flex gap-1">
        <button type="button" class="text-3xl text-gray-300 leading-none transition hover:scale-110">☆</button>
        <button type="button" class="text-3xl text-gray-300 leading-none transition hover:scale-110">☆</button>
        <button type="button" class="text-3xl text-gray-300 leading-none transition hover:scale-110">☆</button>
        <button type="button" class="text-3xl text-gray-300 leading-none transition hover:scale-110">☆</button>
        <button type="button" class="text-3xl text-gray-300 leading-none transition hover:scale-110">☆</button>
      </div>
    </div>

    <div>
      <label for="rdlg-text" class="block text-sm font-medium text-gray-700 mb-1">Your review</label>
      <textarea id="rdlg-text" rows="4" placeholder="What did you think of this book?" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 resize-none"></textarea>
    </div>

    <p id="rdlg-error" class="text-xs text-red-500"></p>

    <div class="flex justify-end gap-2">
      <button type="button" data-dialog-close class="rounded-lg border border-gray-200 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">Cancel</button>
      <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Submit</button>
    </div>
  </form>

  <div id="rdlg-success" class="hidden px-6 py-10 text-center">
    <p class="text-4xl mb-3">&#9733;</p>
    <p class="font-semibold text-gray-900">Thank you for your review!</p>
    <p class="mt-1 text-sm text-gray-500">Your review has been saved.</p>
    <button data-dialog-close class="mt-4 rounded-lg bg-blue-600 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-700">Close</button>
  </div>
</dialog>
