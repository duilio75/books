<ul class="flex items-center gap-0.5 text-sm font-medium">
  {% for item in items %}
  <li>
    <a href="{{ item.get_url }}"{% if item.is_current %} aria-current="page"{% endif %}
      class="relative flex h-9 items-center rounded-lg px-3 {% if item.is_current %}text-blue-700 after:absolute after:inset-x-3 after:bottom-1 after:h-0.5 after:rounded-full after:bg-blue-700{% else %}text-gray-800 hover:bg-gray-50 hover:text-blue-700{% endif %}">
      {{ item.title }}
    </a>
  </li>
  {% endfor %}
</ul>
